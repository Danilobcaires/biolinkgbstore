<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GB STORE — Streetwear DF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#070E1F;
    --navy-card:#0F1B36;
    --blue:#2F6FED;
    --blue-soft:#1B3A73;
    --lime:#D4FF3F;
    --off-white:#F2F5FA;
    --muted:#7C89AC;
    --line:rgba(242,245,250,0.10);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(47,111,237,0.18), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(212,255,63,0.06), transparent 40%),
      var(--navy-deep);
    font-family:'Space Grotesk', sans-serif;
    color:var(--off-white);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 18px 64px;
  }

  .page{
    width:100%;
    max-width:420px;
  }

  /* ---- Hangtag header ---- */
  .tag-header{
    position:relative;
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 28px 30px;
    text-align:center;
    overflow:hidden;
  }

  .tag-header::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:repeating-linear-gradient(90deg, var(--blue) 0 14px, transparent 14px 22px);
    opacity:0.7;
  }

  .punch-hole{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--muted);
    margin:0 auto 18px;
    background:var(--navy-deep);
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--lime);
    margin:0 0 6px;
    text-transform:uppercase;
  }

  .wordmark{
    font-family:'Anton', sans-serif;
    font-size:52px;
    line-height:0.95;
    letter-spacing:0.01em;
    margin:0;
    color:var(--off-white);
  }

  .wordmark span{ color:var(--blue); }

  .subtitle{
    margin:12px 0 0;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---- Links ---- */
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:22px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--navy-card);
    border:1px solid var(--line);
    border-left:3px solid var(--blue);
    border-radius:12px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--off-white);
    transition:transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .link-card:hover{
    transform:translateX(4px);
    border-left-color:var(--lime);
    background:#12203F;
  }

  .link-card .icon{
    flex:none;
    width:38px;
    height:38px;
    border-radius:10px;
    background:var(--blue-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-card .icon svg{ width:19px; height:19px; }

  .link-text{ flex:1; min-width:0; }

  .link-title{
    font-weight:600;
    font-size:15px;
    margin:0;
  }

  .link-sub{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .arrow{
    flex:none;
    color:var(--muted);
    font-size:18px;
  }

  /* ---- Footer / barcode tag ---- */
  .footer{
    margin-top:26px;
    text-align:center;
  }

  .barcode{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2px;
    height:26px;
    margin-bottom:10px;
    opacity:0.55;
  }

  .barcode span{
    width:2px;
    background:var(--muted);
    display:inline-block;
  }

  .footer-text{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0;
  }

  @media (max-width:380px){
    .wordmark{ font-size:44px; }
  }
</style>
</head>
<body>

<div class="page">

    <h1 class="wordmark">GB<span>STORE</span></h1>

  <div class="links">

      <span class="icon">

          <rect x="3" y="3" width="18" height="18" rx="5"/>

    </a>

  </div>

  <div class="footer">
    <div class="barcode" aria-hidden="true">
      <span style="height:100%"></span><span style="height:60%"></span><span style="height:90%"></span><span style="height:40%"></span><span style="height:100%"></span><span style="height:70%"></span><span style="height:50%"></span><span style="height:100%"></span><span style="height:65%"></span><span style="height:85%"></span><span style="height:45%"></span><span style="height:100%"></span><span style="height:55%"></span><span style="height:95%"></span>
    </div>
    <p class="footer-text">GB STORE™ — BRASÍLIA/DF</p>
  </div>

</div>

</body>
</html>
